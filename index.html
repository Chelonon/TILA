<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TILA | Moda Feminina</title>
  <meta name="description" content="Roupas com estilo e preço justo. Compre online.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="topo">
    <nav class="topo__esq">
      <a href="#catalogo" class="topo__link">MULHER</a>
    </nav>

    <a href="#" class="logo" id="logo"><img src="imagens/tila.jpeg" alt="TILA"></a>

    <nav class="topo__dir">
      <a href="#contato" class="topo__link topo__link--ajuda">AJUDA</a>
      <button class="topo__link" id="abrir-carrinho">CESTA (<span id="contador">0</span>)</button>
    </nav>
  </header>

  <!-- CATÁLOGO -->
  <main>
    <p class="titulo-secao" id="catalogo">MULHER / NOVIDADES</p>
    <section class="grade" id="grade"></section>
  </main>

  <!-- RODAPÉ -->
  <footer class="rodape" id="contato">
    <div class="rodape__col">
      <h4>AJUDA</h4>
      <a href="#">Envios</a>
      <a href="#">Pagamentos</a>
      <a href="#">Trocas e devoluções</a>
    </div>
    <div class="rodape__col">
      <h4>EMPRESA</h4>
      <a href="#">Quem somos</a>
      <a href="#">Política de privacidade</a>
    </div>
    <div class="rodape__col">
      <h4>SIGA-NOS</h4>
      <a href="#">Instagram</a>
      <a href="#" id="rodape-whats" target="_blank" rel="noopener">WhatsApp</a>
    </div>
    <p class="rodape__copy" id="rodape-copy"></p>
  </footer>

  <!-- FUNDO ESCURO (atrás dos painéis) -->
  <div class="fundo" id="fundo"></div>

  <!-- PAINEL DA PEÇA -->
  <aside class="painel" id="painel-peca" aria-hidden="true">
    <button class="painel__fechar" data-fechar>FECHAR</button>
    <img id="peca-imagem" alt="">
    <div class="miniaturas" id="peca-miniaturas"></div>
    <div class="painel__info">
      <h2 id="peca-nome"></h2>
      <p class="painel__preco" id="peca-preco"></p>
      <p class="painel__rotulo">TAMANHO</p>
      <div class="tamanhos" id="peca-tamanhos"></div>
      <button class="botao" id="peca-adicionar">ADICIONAR</button>
    </div>
  </aside>

  <!-- PAINEL DA CESTA -->
  <aside class="painel painel--cesta" id="painel-cesta" aria-hidden="true">
    <button class="painel__fechar" data-fechar>FECHAR</button>
    <div class="painel__info">
      <h2>CESTA</h2>
      <div id="cesta-itens"></div>
      <div class="cesta__total">
        <span>TOTAL</span>
        <span id="cesta-total">R$ 0,00</span>
      </div>
      <button class="botao" id="finalizar">FINALIZAR COMPRA</button>
    </div>
  </aside>

  <script src="produtos.js"></script>
  <script src="script.js"></script>
</body>
</html>
